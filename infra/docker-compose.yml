# Ports are bound to 127.0.0.1: the database, Redis and storage must not be reachable from the internet.
# restart: unless-stopped brings them back after a server reboot.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"

  # S3-compatible storage for homework files. The bucket (S3_BUCKET in backend/.env)
  # is created by the backend at startup.
  # Image: Silo, the MinIO community fork by Pigsty (https://github.com/pgsty/silo).
  # MinIO, Inc. removed its free images from Docker Hub and Quay; Silo is a drop-in
  # replacement (same CLI, API and data format), built for amd64 and arm64.
  # Version is pinned, upgrades are explicit.
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
